<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Sky Blue to Indigo Gradient -->
    <linearGradient id="cubeSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- White Accent Gradient -->
    <linearGradient id="cubeWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 3D Isometric Cube Facets -->
  <!-- Top Face -->
  <polygon points="50,14 82,32 50,50 18,32" fill="#161b22" stroke="#334155" stroke-width="1.5" />
  
  <!-- Left Face -->
  <polygon points="18,32 50,50 50,86 18,68" fill="#0d1117" stroke="#334155" stroke-width="1.5" />
  
  <!-- Right Face -->
  <polygon points="50,50 82,32 82,68 50,86" fill="#07090e" stroke="#334155" stroke-width="1.5" />

  <!-- Glowing Floating 'N' Monogram -->
  <g filter="url(#cubeGlow)">
    <!-- Left Vertical Line -->
    <line x1="36" y1="36" x2="36" y2="72" stroke="url(#cubeSkyGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Diagonal Slash (White accent) -->
    <line x1="36" y1="36" x2="64" y2="72" stroke="url(#cubeWhiteGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Right Vertical Line -->
    <line x1="64" y1="36" x2="64" y2="72" stroke="url(#cubeSkyGrad)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Center Glow Node -->
  <circle cx="50" cy="50" r="2.5" fill="#38bdf8" />
</svg>
