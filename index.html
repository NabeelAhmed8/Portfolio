    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      // 1. Reset scroll position on page reload
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);

      // 2. Prevent Chrome extension background scripts (AdBlock, etc.) from polluting dev console
      window.addEventListener('unhandledrejection', function (event) {
        const msg = (event?.reason?.message || '') + '';
        const stack = (event?.reason?.stack || '') + '';
        if (
          msg.includes('Could not establish connection') ||
          msg.includes('Receiving end does not exist') ||
          stack.includes('chrome-extension://') ||
          stack.includes('eyeo')
        ) {
          event.preventDefault();
        }
      });

      window.addEventListener('error', function (event) {
        const file = (event?.filename || '') + '';
        const msg = (event?.message || '') + '';
        if (
          file.includes('chrome-extension://') ||
          msg.includes('Could not establish connection') ||
          msg.includes('Receiving end does not exist') ||
          msg.includes('useCache')
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>

  </body>
